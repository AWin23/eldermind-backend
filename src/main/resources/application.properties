spring.application.name=eldermind-backend

# Keep your app logs visible
logging.level.com.andrew.eldermind=INFO

# Turn this on only when debugging ranking
logging.level.com.andrew.eldermind.lore.retrieval.HybridRetriever=DEBUG

# Reduce Spring/Tomcat noise
logging.level.org.springframework=ERROR
logging.level.org.apache.catalina=ERROR
logging.level.org.apache.coyote=ERROR
logging.level.org.apache.tomcat=ERROR

# Optional: cleaner console format
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n
